<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Accent Behind Character -->
  <circle cx="64" cy="64" r="48" stroke="#10B981" stroke-opacity="0.15" stroke-width="1.5" fill="none" stroke-dasharray="4 4" />
  <circle cx="64" cy="64" r="58" stroke="#06B6D4" stroke-opacity="0.1" stroke-width="1" fill="none" />

  <!-- Code brackets subtle watermark -->
  <text x="14" y="32" fill="#10B981" fill-opacity="0.18" font-family="monospace" font-size="14" font-weight="bold">&lt;/&gt;</text>
  <text x="96" y="104" fill="#06B6D4" fill-opacity="0.15" font-family="monospace" font-size="14" font-weight="bold">{;}</text>

  <!-- Hoodie / Shoulders -->
  <path d="M22 128 C22 100 42 92 64 92 C86 92 106 100 106 128 Z" fill="url(#hoodieGrad)" />
  <path d="M50 93 L64 112 L78 93 C73 98 64 104 50 93 Z" fill="#0F172A" opacity="0.6" />

  <!-- Headphone Band -->
  <path d="M34 56 C34 38 46 26 64 26 C82 26 94 38 94 56" fill="none" stroke="#64748B" stroke-width="4.5" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="56" y="80" width="16" height="16" rx="4" fill="#EAB308" />

  <!-- Head -->
  <ellipse cx="64" cy="62" rx="22" ry="24" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M42 56 C41 40 50 32 64 32 C78 32 87 40 86 56 C83 47 77 44 64 44 C51 44 45 47 42 56 Z" fill="url(#hairGrad)" />

  <!-- Headphone Earcups -->
  <rect x="30" y="50" width="8" height="18" rx="4" fill="url(#accentGrad)" />
  <rect x="90" y="50" width="8" height="18" rx="4" fill="url(#accentGrad)" />

  <!-- Glasses -->
  <rect x="47" y="55" width="14" height="10" rx="3" fill="#0F172A" stroke="#10B981" stroke-width="1.8" />
  <rect x="67" y="55" width="14" height="10" rx="3" fill="#0F172A" stroke="#10B981" stroke-width="1.8" />
  <line x1="61" y1="60" x2="67" y2="60" stroke="#10B981" stroke-width="2" />
  <line x1="43" y1="58" x2="47" y2="58" stroke="#10B981" stroke-width="1.8" />
  <line x1="81" y1="58" x2="85" y2="58" stroke="#10B981" stroke-width="1.8" />

  <!-- Glasses Reflection -->
  <line x1="49" y1="57" x2="52" y2="63" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
  <line x1="69" y1="57" x2="72" y2="63" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

  <!-- Smile -->
  <path d="M58 74 Q64 78 70 74" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
</svg>
